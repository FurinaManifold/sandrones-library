<polygon points="821.0,347.0 816.0,337.0 826.0,337.0" fill="#316C99"/>
<path d="M 162 130 L 162 178" fill="none" stroke="#697C8B" stroke-width="2.3" stroke-dasharray="7 5"/>
<polygon points="162.0,178.0 157.0,168.0 167.0,168.0" fill="#697C8B"/>
<path d="M 482 130 L 482 178" fill="none" stroke="#697C8B" stroke-width="2.3" stroke-dasharray="7 5"/>
<polygon points="482.0,178.0 477.0,168.0 487.0,168.0" fill="#697C8B"/>
<path d="M 821 130 L 821 178" fill="none" stroke="#697C8B" stroke-width="2.3" stroke-dasharray="7 5"/>
<polygon points="821.0,178.0 816.0,168.0 826.0,168.0" fill="#697C8B"/>
<path d="M 821 438 L 821 466 L 482 466 L 482 438" fill="none" stroke="#AE5547" stroke-width="2.3" stroke-dasharray="7 5"/>
<polygon points="482.0,438.0 477.0,448.0 487.0,448.0" fill="#AE5547"/>
<text x="653" y="496" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#AE5547" text-anchor="middle">跨学科接口反馈／返工</text>
<text x="22" y="494" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#697C8B" text-anchor="start">现行基础：每负责人管理 2–3 worker</text>
<text x="22" y="523" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#1E3445" text-anchor="start">扩展示例：100 × 3 = 300 证明 worker；负责人／审核者／CI 另计</text>
<text x="22" y="550" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#697C8B" text-anchor="start">实线：验收包上行；虚线：控制与反馈。按审核容量与队列等待分级扩容。</text>
</svg>
