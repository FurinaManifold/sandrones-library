<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="562" viewBox="0 0 1000 562" role="img">
<title>数百 Agent 的分层审核与发布架构</title><desc>上层控制接口与调度，下层证明工作由小组负责，再由学科队列验收并经单写者发布。三百仅指证明 worker，审核和计算资源另计。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1000" height="562" fill="white"/>
<text x="22" y="34" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#1E3445" text-anchor="start">未来架构：数学审核分层，最终发布保持单写者</text>
<rect x="22" y="57" width="956" height="73" rx="10" fill="#F3F5F7" stroke="#697C8B" stroke-width="1.6" stroke-dasharray="8 5"/>
<text x="42" y="87" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#1E3445" text-anchor="start">控制平面：定理契约目录 · 论文账本 · DAG／所有权 · 队列与证据索引</text>
<text x="42" y="116" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#697C8B" text-anchor="start">接口先冻结；审核积压触发背压；签名变化传播失效</text>
<rect x="22" y="178" width="279" height="260" rx="10" fill="#F1F6FA" stroke="#316C99" stroke-width="1.6"/>
<text x="42" y="213" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#316C99" text-anchor="start">100 个证明小组</text>
<rect x="42" y="233" width="239" height="69" rx="10" fill="white" stroke="#316C99" stroke-width="1.6"/>
<text x="57" y="260" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#316C99" text-anchor="start">小组 01：3 worker</text>
<text x="57" y="287" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#1E3445" text-anchor="start">负责人 · 非作者审核</text>
<rect x="42" y="325" width="239" height="69" rx="10" fill="white" stroke="#316C99" stroke-width="1.6"/>
<text x="57" y="352" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#316C99" text-anchor="start">小组 100：3 worker</text>
<text x="57" y="379" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#1E3445" text-anchor="start">负责人 · 非作者审核</text>
<text x="162" y="322" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#697C8B" text-anchor="middle">···</text>
<text x="42" y="426" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#1E3445" text-anchor="start">独立 worktree／分支／构建</text>
<rect x="351" y="178" width="262" height="260" rx="10" fill="#EDF7F4" stroke="#167D79" stroke-width="1.6"/>
<path d="M365 191 V425" stroke="#167D79" stroke-width="4"/>
<text x="378" y="210" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#167D79" text-anchor="start">10 条学科集成队列</text>
<text x="378" y="242" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#1E3445" text-anchor="start">每条汇总 10 个小组</text>
<text x="378" y="271" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#1E3445" text-anchor="start">数学与语义亲自验收</text>
<text x="378" y="300" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#1E3445" text-anchor="start">闭包构建 · 联合导入</text>
<text x="378" y="329" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#1E3445" text-anchor="start">接口差异 · 增量建议</text>
<text x="378" y="358" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#1E3445" text-anchor="start">输出已提交验收包</text>
<rect x="663" y="178" width="315" height="130" rx="10" fill="#F1F6FA" stroke="#316C99" stroke-width="1.6"/>
<path d="M677 191 V295" stroke="#316C99" stroke-width="4"/>
<text x="690" y="210" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#316C99" text-anchor="start">自动合并与发布列车</text>
<text x="690" y="242" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#1E3445" text-anchor="start">唯一写者生成共享状态</text>
<text x="690" y="271" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#1E3445" text-anchor="start">精确候选 CI · 失败拆包</text>
<text x="690" y="300" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#1E3445" text-anchor="start">公理／audit／全库构建</text>
<rect x="663" y="347" width="315" height="91" rx="10" fill="#EDF7F4" stroke="#167D79" stroke-width="1.6"/>
<path d="M677 360 V425" stroke="#167D79" stroke-width="4"/>
<text x="690" y="379" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#167D79" text-anchor="start">Main 治理与发布</text>
<text x="690" y="411" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#1E3445" text-anchor="start">跨学科 API · 例外 · 最终提交</text>
<path d="M 301 297 L 351 297" fill="none" stroke="#316C99" stroke-width="2.3"/>
<polygon points="351.0,297.0 341.0,292.0 341.0,302.0" fill="#316C99"/>
