<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img">
<title>著名定理的名称如何变成明确接口</title><desc>名称只作检索。通过来源、版本契约和审核建立可调用声明。Hahn–Banach 的三个具体声明分别保留。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1000" height="410" fill="white"/>
<text x="22" y="34" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#1E3445" text-anchor="start">名称索引 → 来源定位 → 版本契约 → 明确调用</text>
<rect x="22" y="62" width="177" height="130" rx="10" fill="#F1F6FA" stroke="#316C99" stroke-width="1.6"/>
<path d="M36 75 V179" stroke="#316C99" stroke-width="4"/>
<text x="49" y="94" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#316C99" text-anchor="start">著名名称</text>
<text x="49" y="126" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#1E3445" text-anchor="start">Hahn–Banach</text>
<text x="49" y="155" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#1E3445" text-anchor="start">发现定理家族</text>
<rect x="235" y="62" width="208" height="130" rx="10" fill="#F1F6FA" stroke="#316C99" stroke-width="1.6"/>
<path d="M249 75 V179" stroke="#316C99" stroke-width="4"/>
<text x="262" y="94" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#316C99" text-anchor="start">定位具体来源</text>
<text x="262" y="126" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#1E3445" text-anchor="start">版本 · 原页</text>
<text x="262" y="155" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#1E3445" text-anchor="start">恢复符号与假设</text>
<rect x="479" y="62" width="245" height="130" rx="10" fill="#EDF7F4" stroke="#167D79" stroke-width="1.6"/>
<path d="M493 75 V179" stroke="#167D79" stroke-width="4"/>
<text x="506" y="94" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#167D79" text-anchor="start">冻结数学契约</text>
<text x="506" y="126" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#1E3445" text-anchor="start">对象 · 量词 · 边界</text>
<text x="506" y="155" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#1E3445" text-anchor="start">Lean 类型 · 依赖</text>
<rect x="760" y="62" width="218" height="130" rx="10" fill="#EDF7F4" stroke="#167D79" stroke-width="1.6"/>
<path d="M774 75 V179" stroke="#167D79" stroke-width="4"/>
<text x="787" y="94" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#167D79" text-anchor="start">验收后调用</text>
<text x="787" y="126" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#1E3445" text-anchor="start">具名声明与证据</text>
<text x="787" y="155" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#1E3445" text-anchor="start">实际下游使用者</text>
<path d="M 199 127 L 235 127" fill="none" stroke="#697C8B" stroke-width="2.3"/>
<polygon points="235.0,127.0 225.0,122.0 225.0,132.0" fill="#697C8B"/>
<path d="M 443 127 L 479 127" fill="none" stroke="#697C8B" stroke-width="2.3"/>
<polygon points="479.0,127.0 469.0,122.0 469.0,132.0" fill="#697C8B"/>
<path d="M 724 127 L 760 127" fill="none" stroke="#697C8B" stroke-width="2.3"/>
