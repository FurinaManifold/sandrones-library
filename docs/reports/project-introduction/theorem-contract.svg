<text x="22" y="226" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#1E3445" text-anchor="start">仓库现有示例：一个 Entry，三个可区分的公开声明</text>
<rect x="22" y="248" width="295" height="93" rx="10" fill="#F1F6FA" stroke="#316C99" stroke-width="1.6"/>
<path d="M36 261 V328" stroke="#316C99" stroke-width="4"/>
<text x="49" y="280" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#316C99" text-anchor="start">C1  实支配延拓</text>
<text x="49" y="312" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#1E3445" text-anchor="start">次线性控制 → 保持支配</text>
<rect x="353" y="248" width="295" height="93" rx="10" fill="#EDF7F4" stroke="#167D79" stroke-width="1.6"/>
<path d="M367 261 V328" stroke="#167D79" stroke-width="4"/>
<text x="380" y="280" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#167D79" text-anchor="start">C2  实等范数延拓</text>
<text x="380" y="312" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#1E3445" text-anchor="start">连续线性泛函 → 等范数</text>
<rect x="684" y="248" width="294" height="93" rx="10" fill="#EDF7F4" stroke="#167D79" stroke-width="1.6"/>
<path d="M698 261 V328" stroke="#167D79" stroke-width="4"/>
<text x="711" y="280" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#167D79" text-anchor="start">C3  实不增范数延拓</text>
<text x="711" y="312" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#1E3445" text-anchor="start">相同前提 → 范数不增</text>
<path d="M 500 341 L 500 365 L 831 365 L 831 341" fill="none" stroke="#167D79" stroke-width="2.3"/>
<polygon points="831.0,341.0 826.0,351.0 836.0,351.0" fill="#167D79"/>
<text x="665" y="396" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#167D79" text-anchor="middle">源码已证：C2 推出 C3</text>
<text x="22" y="378" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#697C8B" text-anchor="start">C1 与 C2 的互换</text>
<text x="22" y="403" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#697C8B" text-anchor="start">需条件与桥，不能凭名字</text>
</svg>
